server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/prepper-portal;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /manuals/ {
        alias /srv/prepper-library/manuals/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /maps/data/ {
        alias /srv/prepper-library/maps/;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /generate_204 { return 302 http://10.10.10.1/; }
    location = /gen_204 { return 302 http://10.10.10.1/; }
    location = /hotspot-detect.html { return 302 http://10.10.10.1/; }
    location = /connecttest.txt { return 302 http://10.10.10.1/; }
    location = /ncsi.txt { return 302 http://10.10.10.1/; }

    location ~ /\. {
        deny all;
    }
}

